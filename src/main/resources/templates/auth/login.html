<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - DANKOOK STORE</title>
    <style>
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --ink: #102a4a;
            --sub-ink: #4a5970;
            --line: #d8dee8;
            --primary: #0a559c;
            --primary-hover: #084985;
            --danger: #b42318;
            --ok: #027a48;
            --shadow: 0 16px 34px rgba(9, 30, 66, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(180deg, #f2f5fa 0%, var(--bg) 100%);
            color: var(--ink);
            font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", sans-serif;
            position: relative;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            pointer-events: none;
            opacity: 0.45;
            color: #d9deea;
        }

        .bg-book {
            top: -40px;
            left: 30px;
            width: 30vw;
        }

        .bg-building {
            right: 24px;
            bottom: -18px;
            width: 46vw;
        }

        .auth-card {
            width: 100%;
            max-width: 390px;
            background: var(--card);
            border: 1px solid #e9edf4;
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 34px 32px 30px;
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin: 0;
            color: var(--primary);
            font-size: 34px;
            letter-spacing: 0.3px;
            font-weight: 800;
            line-height: 1;
        }

        .subtitle {
            margin: 2px 0 18px;
            text-align: center;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .page-title {
            text-align: center;
            margin: 0 0 18px;
            font-size: 42px;
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .status-message {
            margin: 0 0 12px;
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-success {
            background: #ecfdf3;
            color: var(--ok);
            border: 1px solid #abefc6;
        }

        .status-error {
            background: #fef3f2;
            color: var(--danger);
            border: 1px solid #fecdca;
        }

        .field-wrap { margin-bottom: 12px; }

        .field-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #23354f;
            font-weight: 700;
        }

        .input-shell {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 46px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .input-shell:focus-within {
            border-color: #4f84ba;
            box-shadow: 0 0 0 3px rgba(10, 85, 156, 0.16);
        }

        .icon {
            width: 18px;
            height: 18px;
            color: #8a94a7;
            flex: 0 0 auto;
            margin-right: 8px;
        }

        .field-input {
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            color: #1d3049;
            font-size: 15px;
            font-weight: 500;
        }

        .field-input::placeholder { color: #a0a9ba; }

        .toggle-btn {
            border: 0;
            background: transparent;
            padding: 4px;
            color: #8a94a7;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .toggle-btn:hover { color: #5e6f88; }

        .login-btn {
            width: 100%;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(180deg, #1a67af 0%, var(--primary) 100%);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.2px;
            height: 46px;
            margin-top: 8px;
            cursor: pointer;
            transition: filter 0.16s ease, transform 0.1s ease;
        }

        .login-btn:hover {
            filter: brightness(0.96);
            background: var(--primary-hover);
        }

        .login-btn:active { transform: translateY(1px); }

        .signup-link-wrap {
            text-align: center;
            margin-top: 15px;
            color: var(--sub-ink);
            font-size: 14px;
            font-weight: 500;
        }

        .signup-link-wrap a {
            color: var(--primary);
            font-weight: 700;
            text-underline-offset: 2px;
        }

        @media (max-width: 640px) {
            body { padding: 16px; }

            .auth-card {
                max-width: 100%;
                padding: 28px 20px 22px;
            }

            .brand { font-size: 30px; }
            .page-title { font-size: 34px; }
            .bg-book { width: 30vw; opacity: 0.35; }
            .bg-building { width: 46vw; opacity: 0.35; }
        }
    </style>
</head>
<body>
<svg class="bg-shape bg-book" viewBox="0 0 260 180" fill="none" aria-hidden="true">
    <path d="M20 130C55 112 92 112 130 130C168 112 205 112 240 130V30C205 12 168 12 130 30C92 12 55 12 20 30V130Z" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
    <path d="M130 30V130" stroke="currentColor" stroke-width="8"/>
    <path d="M45 53H105M45 73H105M45 93H105M155 53H215M155 73H215M155 93H215" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
</svg>

<svg class="bg-shape bg-building" viewBox="0 0 360 280" fill="none" aria-hidden="true">
    <rect x="20" y="120" width="70" height="140" stroke="currentColor" stroke-width="8" rx="8"/>
    <rect x="270" y="120" width="70" height="140" stroke="currentColor" stroke-width="8" rx="8"/>
    <path d="M105 260V120L180 80L255 120V260" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
    <rect x="158" y="196" width="44" height="64" stroke="currentColor" stroke-width="8" rx="4"/>
    <circle cx="180" cy="130" r="14" stroke="currentColor" stroke-width="8"/>
    <path d="M180 80V45M160 45H200V68H160V45Z" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
    <g stroke="currentColor" stroke-width="7">
        <rect x="35" y="145" width="20" height="28" rx="2"/>
        <rect x="35" y="188" width="20" height="28" rx="2"/>
        <rect x="55" y="145" width="20" height="28" rx="2"/>
        <rect x="55" y="188" width="20" height="28" rx="2"/>
        <rect x="125" y="145" width="22" height="28" rx="2"/>
        <rect x="157" y="145" width="22" height="28" rx="2"/>
        <rect x="189" y="145" width="22" height="28" rx="2"/>
        <rect x="221" y="145" width="22" height="28" rx="2"/>
        <rect x="125" y="188" width="22" height="28" rx="2"/>
        <rect x="157" y="188" width="22" height="28" rx="2"/>
        <rect x="189" y="188" width="22" height="28" rx="2"/>
        <rect x="221" y="188" width="22" height="28" rx="2"/>
        <rect x="285" y="145" width="20" height="28" rx="2"/>
        <rect x="285" y="188" width="20" height="28" rx="2"/>
        <rect x="305" y="145" width="20" height="28" rx="2"/>
        <rect x="305" y="188" width="20" height="28" rx="2"/>
    </g>
</svg>

<main class="auth-card">
    <h1 class="brand">DANKOOK STORE</h1>
    <p class="subtitle">Official Campus Marketplace</p>
    <p class="page-title">Login</p>

    <div th:if="${param.logout}" class="status-message status-success">로그아웃되었습니다.</div>
    <div th:if="${errorMessage}" th:text="${errorMessage}" class="status-message status-error"></div>

    <form action="/auth/login" method="post">
<!--        login error-->
        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">
        <div class="field-wrap">
            <label for="username" class="field-label">ID</label>
            <div class="input-shell">
                <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 20C4.7 16.8 7.4 14.5 12 14.5C16.6 14.5 19.3 16.8 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input id="username" class="field-input" type="text" name="username" placeholder="Enter your ID" required autofocus>
            </div>
        </div>

        <div class="field-wrap">
            <label for="password" class="field-label">Password</label>
            <div class="input-shell">
                <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M8 10V7.5C8 5.6 9.6 4 11.5 4H12.5C14.4 4 16 5.6 16 7.5V10" stroke="currentColor" stroke-width="2"/>
                </svg>
                <input id="password" class="field-input" type="password" name="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-btn" id="togglePassword" aria-label="비밀번호 보기 전환">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" style="margin:0" aria-hidden="true">
                        <path d="M3 3L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M9.9 9.9C9.3 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.7 14.1 14.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M6.7 6.7C5 8 3.8 9.8 3 12C4.5 16.1 8 18.5 12 18.5C13.8 18.5 15.5 18 16.9 17.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10.8 5.6C11.2 5.5 11.6 5.5 12 5.5C16 5.5 19.5 7.9 21 12C20.5 13.4 19.8 14.6 18.9 15.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="signup-link-wrap">
        Don't have an account? <a th:href="@{/auth/signup}">Sign Up</a>
    </p>
</main>

<script>
    (function () {
        const passwordInput = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.addEventListener("click", function () {
            const hidden = passwordInput.type === "password";
            passwordInput.type = hidden ? "text" : "password";
        });
    }());
</script>
</body>
</html>
