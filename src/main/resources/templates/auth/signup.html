<!DOCTYPE html>
<html xmlns:th="[thymeleaf.org](http://www.thymeleaf.org)">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h1>회원가입</h1>

<!-- 서버 오류 메시지 (아이디 중복 등) -->
<div th:if="${errorMessage}" th:text="${errorMessage}" style="color:red"></div>

<form th:action="@{/auth/signup}" th:object="${signupDto}" method="post">
    <div>
        <label>아이디</label>
        <input type="text" th:field="*{username}" placeholder="아이디 (4~20자)">
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></span>
    </div>
    <div>
        <label>비밀번호</label>
        <input type="password" th:field="*{password}" placeholder="비밀번호 (8자 이상)">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></span>
    </div>
    <div>
        <label>카카오톡 아이디</label>
        <input type="text" th:field="*{kakaoId}" placeholder="카카오톡 아이디">
        <span th:if="${#fields.hasErrors('kakaoId')}" th:errors="*{kakaoId}" style="color:red"></span>
    </div>
    <button type="submit">회원가입</button>
</form>

<a th:href="@{/auth/login}">로그인으로 돌아가기</a>
</body>
</html>
