<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>배송 메모 관리 - DANKOOK STORE</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>

<nav>
    <a class="brand" th:href="@{/}">DANKOOK STORE</a>
    <div class="nav-links">
        <a th:href="@{/}">홈</a>
        <a th:href="@{/mypage}">마이페이지</a>
        <a th:href="@{/cart}" sec:authorize="!hasRole('ADMIN')">장바구니</a>
        <a th:href="@{/notifications}">알림</a>
    </div>
    <form th:action="@{/auth/logout}" method="post" style="margin:0;">
        <button type="submit" class="btn-logout">로그아웃</button>
    </form>
</nav>

<div class="page">
    <aside class="sidebar">
        <h1 class="sidebar-title">마이페이지</h1>
        <a class="menu-link" th:href="@{/mypage(tab='profile')}">내 정보</a>
        <a class="menu-link" th:href="@{/mypage(tab='purchase')}">구매/관리</a>
        <a class="menu-link" th:href="@{/mypage(tab='wishlist')}">관심목록</a>
        <a class="menu-link" th:href="@{/mypage(tab='settings')}">계정 설정</a>
        <a class="menu-link active" th:href="@{/mypage/order-settings}">주문 설정</a>
    </aside>

    <main class="content">
        <div class="breadcrumb">마이페이지 / 주문 설정 / 배송 메모 관리</div>
        <section class="section-card">
            <div class="section-header">
                <div>
                    <h2 class="section-title">배송 메모 관리</h2>
                    <p class="section-desc">자주 쓰는 배송 요청사항만 따로 저장해 주문서에서 다시 선택합니다.</p>
                </div>
                <a class="btn-secondary" th:href="@{/mypage/order-settings}">주문 설정으로 돌아가기</a>
            </div>

            <div th:if="${settingsSuccess}" class="alert alert-success" th:text="${settingsSuccess}">저장되었습니다.</div>
            <div th:if="${settingsError}" class="alert alert-error" th:text="${settingsError}">오류가 발생했습니다.</div>

            <div class="empty-state" th:if="${#lists.isEmpty(savedMemoPresets)}">저장된 배송 메모가 없습니다.</div>
            <div class="manage-grid" th:if="${!#lists.isEmpty(savedMemoPresets)}">
                <div class="manage-card" th:each="preset : ${savedMemoPresets}">
                    <div class="manage-head">
                        <div>
                            <p class="manage-title">
                                배송 메모
                                <span class="status-badge" th:if="${preset.defaultMemo}">기본</span>
                            </p>
                            <p class="manage-summary" th:text="${preset.memo}">문 앞에 놓아주세요.</p>
                        </div>
                        <form th:action="@{/mypage/settings/delivery-memo/{id}/delete(id=${preset.id})}" method="post">
                            <button type="submit" class="btn-danger">삭제</button>
                        </form>
                    </div>
                    <form class="manage-form" th:action="@{/mypage/settings/delivery-memo}" method="post">
                        <input type="hidden" name="id" th:value="${preset.id}">
                        <div class="form-grid">
                            <div class="full">
                                <label>배송 메모</label>
                                <textarea name="memo" th:text="${preset.memo}" required></textarea>
                            </div>
                        </div>
                        <div class="check-row">
                            <label><input type="checkbox" name="defaultMemo" data-default-group="delivery-memo" th:checked="${preset.defaultMemo}"> 기본 배송 메모로 설정</label>
                        </div>
                        <div class="manage-actions">
                            <button type="submit" class="btn-primary">배송 메모 저장</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="manage-card" style="margin-top:16px;">
                <div class="manage-head">
                    <div>
                        <p class="manage-title">배송 메모 추가</p>
                        <p class="manage-summary">예: 문 앞에 놓아주세요, 경비실에 맡겨주세요, 배송 전 연락주세요</p>
                    </div>
                </div>
                <form class="manage-form" th:action="@{/mypage/settings/delivery-memo}" method="post">
                    <div class="form-grid">
                        <div class="full">
                            <label>배송 메모</label>
                            <textarea name="memo" required></textarea>
                        </div>
                    </div>
                    <div class="check-row">
                        <label><input type="checkbox" name="defaultMemo" data-default-group="delivery-memo"> 기본 배송 메모로 설정</label>
                    </div>
                    <div class="manage-actions">
                        <button type="submit" class="btn-primary">배송 메모 추가</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/mypage-default-checkbox.js}"></script>
</body>
</html>
