<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 단북</title>
</head>
<body>
<nav>
    <a th:href="@{/}">홈</a> |
    <a th:href="@{/products}">상품 목록</a> |
    <a th:href="@{/notifications}">
        알림<span th:if="${unreadCount > 0}" th:text="'(' + ${unreadCount} + ')'" style="color:red; font-weight:bold"></span>
    </a> |
    <form th:action="@{/auth/logout}" method="post" style="display:inline">
        <button type="submit" style="background:none;border:none;cursor:pointer;padding:0;color:inherit;text-decoration:underline">로그아웃</button>
    </form>
</nav>

<hr>

<h2>마이페이지</h2>

<!-- 내 정보 -->
<section>
    <h3>내 정보</h3>
    <p>아이디: <strong th:text="${user.username}">아이디</strong></p>
    <p>카카오톡 아이디: <strong th:text="${user.kakaoId}">카카오</strong></p>
</section>

<hr>

<!-- 내가 등록한 상품 -->
<section>
    <h3>내 상품 목록</h3>
    <a th:href="@{/products/new}">+ 새 상품 등록</a>
    <br><br>
    <div th:if="${#lists.isEmpty(myProducts)}">
        <p>등록한 상품이 없습니다.</p>
    </div>
    <table th:if="${!#lists.isEmpty(myProducts)}" border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>상품명</th>
                <th>카테고리</th>
                <th>가격</th>
                <th>상태</th>
                <th>등록일</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${myProducts}">
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.title}">제목</a>
                </td>
                <td th:text="${product.category.displayName}">카테고리</td>
                <td th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">가격</td>
                <td th:text="${product.status.displayName}">상태</td>
                <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}">날짜</td>
                <td>
                    <a th:href="@{/products/{id}/edit(id=${product.id})}">수정</a>
                    &nbsp;
                    <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('정말 삭제하시겠습니까?')">
                        <button type="submit">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</section>

<hr>

<!-- 찜 목록 -->
<section>
    <h3>찜 목록</h3>
    <div th:if="${#lists.isEmpty(wishlist)}">
        <p>찜한 상품이 없습니다.</p>
    </div>
    <div th:each="item : ${wishlist}">
        <div>
            <a th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.title}">제목</a>
            &nbsp;
            <span th:text="${#numbers.formatInteger(item.product.price, 0, 'COMMA')} + '원'">가격</span>
            <span th:text="'[' + ${item.product.category.displayName} + ']'">[카테고리]</span>
            <span th:text="${item.product.status.displayName}">상태</span>
            &nbsp;
            <!-- 찜 해제 -->
            <form th:action="@{/products/{id}/wishlist(id=${item.product.id})}" method="post" style="display:inline">
                <button type="submit">♥ 찜 해제</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
