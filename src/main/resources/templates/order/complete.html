<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단국스토어 - 구매 완료</title>
    <link rel="stylesheet" href="/css/darkmode.css">
    <script src="/js/darkmode.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f8f9fc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: #fff;
            border-radius: 20px;
            padding: 60px 50px;
            text-align: center;
            border: 1px solid #e1e4e8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 90%;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0059a9, #4a9eff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(0,89,169,0.25);
        }
        h2 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #2d3436;
            margin: 0 0 10px;
        }
        p {
            color: #999;
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0 0 32px;
        }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn-primary {
            background: #0059a9;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-primary:hover { background: #004582; }
        .btn-outline {
            background: #fff;
            color: #0059a9;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1.5px solid #0059a9;
            transition: 0.2s;
        }
        .btn-outline:hover { background: #eef4ff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✓</div>
        <h2>구매가 완료됐습니다!</h2>
        <p>마이페이지 구매 내역에서<br>확인하실 수 있습니다.</p>
        <div class="btn-group">
            <a th:href="@{/mypage}" class="btn-primary">구매 내역 확인</a>
            <a th:href="@{/}" class="btn-outline">쇼핑 계속하기</a>
        </div>
    </div>
</body>
</html>
