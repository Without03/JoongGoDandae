<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 완료 - DANKOOK STORE</title>
    <link rel="stylesheet" href="/css/darkmode.css">
    <script src="/js/darkmode.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f5f8;
            color: #1f2937;
            font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", sans-serif;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .box {
            width: min(440px, 100%);
            background: #fff;
            border: 1px solid #e2e7ef;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            padding: 42px 34px;
            text-align: center;
        }

        .mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #0a559c;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 34px;
            font-weight: 900;
        }

        h1 {
            margin: 0 0 10px;
            color: #102a4a;
            font-size: 26px;
            font-weight: 900;
        }

        p {
            margin: 0;
            color: #6b7280;
            line-height: 1.6;
            font-size: 14px;
            font-weight: 600;
        }

        .order-id {
            margin-top: 12px;
            color: #44556f;
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 28px;
        }

        .btn {
            height: 42px;
            border-radius: 10px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
        }

        .btn-main {
            background: #0a559c;
            color: #fff;
        }

        .btn-outline {
            border: 1px solid #d7deea;
            color: #44556f;
            background: #fff;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="mark">✓</div>
    <h1>주문이 완료되었습니다</h1>
    <p>마이페이지 구매 내역에서 주문한 상품을 확인할 수 있습니다.</p>
    <p class="order-id" th:if="${orderId != null}" th:text="'주문번호 #' + ${orderId}">주문번호</p>
    <div class="actions">
        <a th:href="@{/mypage(tab='purchase')}" class="btn btn-main">구매 내역 보기</a>
        <a th:href="@{/}" class="btn btn-outline">계속 둘러보기</a>
    </div>
</div>
</body>
</html>
