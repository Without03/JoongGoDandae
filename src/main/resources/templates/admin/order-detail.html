<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 상세 - DANKOOK STORE</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; background: #f3f6fa; color: #08213f; }
        nav { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid #dce4ef; }
        .brand { color: #07579f; font-size: 28px; font-weight: 900; text-decoration: none; }
        .nav-links { display: flex; gap: 18px; align-items: center; }
        .nav-links a, .logout { color: #1b3452; font-weight: 700; text-decoration: none; background: none; border: 0; cursor: pointer; font-size: 14px; }
        .page { max-width: 1120px; margin: 28px auto 64px; padding: 0 20px; }
        .back { display: inline-flex; margin-bottom: 16px; color: #0b5ea8; font-weight: 800; text-decoration: none; }
        .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr); gap: 18px; }
        .card { background: #fff; border: 1px solid #d8e2ef; border-radius: 10px; padding: 22px; }
        h1 { margin: 0 0 8px; color: #07579f; font-size: 30px; }
        h2 { margin: 0 0 16px; font-size: 20px; }
        .muted { color: #65778d; font-size: 14px; }
        .status { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; background: #e8f2ff; color: #07579f; font-size: 13px; font-weight: 900; }
        .status-RECEIVED { background: #eaf4ff; color: #4c7ca8; }
        .status-PAYMENT_PENDING { background: #d8ebff; color: #2f6f9f; }
        .status-PAID { background: #bfdfff; color: #07579f; }
        .status-PREPARING { background: #95cbff; color: #064b88; }
        .status-SHIPPING { background: #66aff4; color: #063e73; }
        .status-DELIVERED { background: #328bdc; color: #ffffff; }
        .status-CANCELED { background: #ffe3e3; color: #c92a2a; }
        .info { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; margin-top: 18px; }
        .label { color: #65778d; font-weight: 800; }
        .value { font-weight: 700; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: left; }
        th { color: #65778d; font-size: 13px; background: #f8fafc; }
        .price { font-weight: 900; }
        select, textarea, button { width: 100%; border: 1px solid #cbd8e8; border-radius: 8px; font: inherit; }
        select { height: 42px; padding: 0 12px; }
        textarea { min-height: 92px; padding: 12px; resize: vertical; margin-top: 10px; }
        button.primary { height: 42px; margin-top: 10px; background: #0b5ea8; border-color: #0b5ea8; color: #fff; font-weight: 900; cursor: pointer; }
        .flash-ok, .flash-error { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-weight: 800; }
        .flash-ok { background: #e8f8ef; color: #137641; border: 1px solid #bde6cc; }
        .flash-error { background: #fff0f0; color: #c43232; border: 1px solid #f1c3c3; }
        .history { display: grid; gap: 12px; }
        .history-item { border: 1px solid #e0e8f2; border-radius: 8px; padding: 12px; }
        .history-title { font-weight: 900; }
        .history-memo { margin-top: 6px; color: #43566f; white-space: pre-wrap; }
        @media (max-width: 820px) {
            nav, .grid { display: block; }
            .nav-links { margin-top: 12px; }
            nav { height: auto; padding: 18px; }
            .card { margin-bottom: 16px; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>

<body>
    <nav>
        <a class="brand" th:href="@{/}">DANKOOK STORE</a>
        <div class="nav-links">
            <a th:href="@{/}">홈</a>
            <a th:href="@{/mypage}">마이페이지</a>
            <a th:href="@{/admin/orders}">주문 관리</a>
            <form th:action="@{/auth/logout}" method="post" style="margin:0;">
                <button class="logout" type="submit">로그아웃</button>
            </form>
        </div>
    </nav>

    <main class="page">
        <a class="back" th:href="@{/admin/orders}">← 주문 목록으로</a>

        <div th:if="${adminOrderSuccess}" class="flash-ok" th:text="${adminOrderSuccess}">저장되었습니다.</div>
        <div th:if="${adminOrderError}" class="flash-error" th:text="${adminOrderError}">오류가 발생했습니다.</div>

        <div class="grid">
            <section class="card">
                <h1 th:text="'ORD-' + ${order.id}">ORD-1</h1>
                <span class="status" th:classappend="' status-' + ${order.status.name()}" th:text="${order.status.displayName}">주문 접수</span>
                <p class="muted" th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</p>

                <div class="info">
                    <div class="label">구매자</div>
                    <div class="value" th:text="${order.ordererUsername}">user</div>
                    <div class="label">이메일</div>
                    <div class="value" th:text="${order.ordererEmail}">email@example.com</div>
                    <div class="label">수령인</div>
                    <div class="value" th:text="${order.recipientName}">수령인</div>
                    <div class="label">전화번호</div>
                    <div class="value" th:text="${order.phone}">010-0000-0000</div>
                    <div class="label">주소</div>
                    <div class="value" th:text="'(' + ${order.zipcode} + ') ' + ${order.address1} + ' ' + ${order.address2}">주소</div>
                    <div class="label">배송 메모</div>
                    <div class="value" th:text="${order.deliveryMemo ?: '-'}">-</div>
                    <div class="label">결제수단</div>
                    <div class="value" th:text="${order.paymentMethodLabel}">결제수단</div>
                </div>

                <h2 style="margin-top: 28px;">주문 상품</h2>
                <table>
                    <thead>
                        <tr>
                            <th>상품명</th>
                            <th>수량</th>
                            <th>단가</th>
                            <th>합계</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.productTitle}">상품명</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="${#numbers.formatInteger(item.unitPrice, 3, 'COMMA')} + '원'">0원</td>
                            <td class="price" th:text="${#numbers.formatInteger(item.lineTotal, 3, 'COMMA')} + '원'">0원</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3">총 주문금액</th>
                            <th class="price" th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">0원</th>
                        </tr>
                    </tfoot>
                </table>
            </section>

            <aside>
                <section class="card">
                    <h2>처리 상태 변경</h2>
                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                        <select name="status" aria-label="변경할 주문 상태">
                            <option th:each="status : ${statuses}" th:value="${status.name()}" th:selected="${status == order.status}" th:text="${status.displayName}">상태</option>
                        </select>
                        <textarea name="memo" placeholder="처리 메모를 입력하세요"></textarea>
                        <button class="primary" type="submit">상태 변경</button>
                    </form>
                </section>

                <section class="card" style="margin-top: 18px;">
                    <h2>처리 이력</h2>
                    <div class="muted" th:if="${#lists.isEmpty(histories)}">아직 처리 이력이 없습니다.</div>
                    <div class="history" th:if="${!#lists.isEmpty(histories)}">
                        <div class="history-item" th:each="history : ${histories}">
                            <div class="history-title">
                                <span th:text="${history.fromStatus.displayName}">이전</span>
                                <span> → </span>
                                <span th:text="${history.toStatus.displayName}">다음</span>
                            </div>
                            <div class="muted">
                                <span th:text="${history.adminUser.username}">admin</span>
                                <span> · </span>
                                <span th:text="${#temporals.format(history.changedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</span>
                            </div>
                            <div class="history-memo" th:if="${history.memo}" th:text="${history.memo}">메모</div>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
    </main>
</body>

</html>
