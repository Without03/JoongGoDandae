<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>장바구니 - DANKOOK STORE</title>
    <link rel="stylesheet" href="/css/darkmode.css">
    <script src="/js/darkmode.js"></script>
    <style>
        :root {
            --main: #0a559c;
            --main-dark: #084985;
            --bg: #f3f5f8;
            --panel: #fff;
            --line: #e2e7ef;
            --text: #1f2937;
            --muted: #6b7280;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", sans-serif;
        }

        .top-header {
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .top-inner {
            max-width: 1000px;
            margin: 0 auto;
            height: 70px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            color: var(--main);
            text-decoration: none;
            font-size: 28px;
            font-weight: 900;
        }

        .top-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .top-link {
            color: #44556f;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 8px;
        }

        .top-link:hover {
            background: #edf4fb;
            color: var(--main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 34px 20px 46px;
        }

        .page-title {
            margin: 0 0 18px;
            color: #102a4a;
            font-size: 30px;
            font-weight: 900;
        }

        .alert {
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fef2f2;
            color: #991b1b;
            font-weight: 700;
        }

        .cart-card,
        .cart-summary {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
        }

        .cart-header {
            padding: 18px 22px;
            border-bottom: 1px solid #edf1f7;
            color: #44556f;
            font-size: 14px;
            font-weight: 800;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr) auto auto;
            gap: 16px;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid #edf1f7;
        }

        .cart-item:last-child { border-bottom: 0; }

        .item-thumb {
            width: 76px;
            height: 76px;
            border-radius: 10px;
            object-fit: cover;
            background: #f4f6fa;
            border: 1px solid #edf1f7;
        }

        .item-title {
            display: block;
            color: #102a4a;
            text-decoration: none;
            font-weight: 900;
            line-height: 1.35;
        }

        .item-title:hover { color: var(--main); }

        .item-category {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .item-stock {
            display: block;
            margin-top: 6px;
            color: #7c2d12;
            font-size: 12px;
            font-weight: 700;
        }

        .item-price {
            white-space: nowrap;
            color: #111827;
            font-size: 17px;
            font-weight: 900;
            text-align: right;
        }

        .item-line-total {
            margin-top: 4px;
            font-size: 12px;
            color: #6b7280;
            font-weight: 700;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .quantity-input {
            width: 88px;
            height: 36px;
            border: 1px solid #d7deea;
            border-radius: 8px;
            padding: 0 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-remove {
            height: 34px;
            border: 1px solid #d7deea;
            border-radius: 8px;
            background: #fff;
            color: #6b7280;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
        }

        .btn-remove:hover {
            border-color: #fca5a5;
            color: #dc2626;
            background: #fef2f2;
        }

        .cart-summary {
            margin-top: 16px;
            padding: 20px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .summary-label {
            color: #44556f;
            font-size: 15px;
            font-weight: 800;
        }

        .summary-total {
            color: var(--main);
            font-size: 24px;
            font-weight: 900;
        }

        .order-btn {
            height: 42px;
            border: 0;
            border-radius: 10px;
            background: var(--main);
            color: #fff;
            padding: 0 22px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 900;
        }

        .order-btn:hover { background: var(--main-dark); }

        .cart-body {
            padding: 58px 24px;
            text-align: center;
        }

        .empty-text {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.6;
            font-weight: 700;
        }

        .btn-blue {
            display: inline-flex;
            align-items: center;
            height: 42px;
            border-radius: 10px;
            background: var(--main);
            color: #fff;
            padding: 0 20px;
            text-decoration: none;
            font-weight: 900;
        }

        @media (max-width: 720px) {
            .cart-item {
                grid-template-columns: 64px minmax(0, 1fr);
            }

            .item-price,
            .item-controls {
                grid-column: 2;
                justify-content: flex-start;
                text-align: left;
            }

            .cart-summary {
                align-items: stretch;
                flex-direction: column;
            }

            .order-btn { width: 100%; }
        }
    </style>
</head>
<body>
<header class="top-header">
    <div class="top-inner">
        <a class="brand" th:href="@{/}">DANKOOK STORE</a>
        <nav class="top-nav">
            <a class="top-link" th:href="@{/}">홈</a>
            <a class="top-link" th:href="@{/mypage}">마이페이지</a>
            <a class="top-link" th:href="@{/notifications}">알림</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="page-title">장바구니</h1>
    <div class="alert" th:if="${cartError}" th:text="${cartError}">오류</div>

    <div class="cart-card" th:if="${#lists.isEmpty(cartItems)}">
        <div class="cart-body">
            <p class="empty-text">장바구니가 비어 있습니다.<br>메인 화면에서 상품을 확인해보세요.</p>
            <a th:href="@{/}" class="btn-blue">계속 둘러보기</a>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="cart-card">
            <div class="cart-header" th:text="${#lists.size(cartItems)} + '개의 상품'">0개의 상품</div>

            <div class="cart-item" th:each="item : ${cartItems}">
                <img class="item-thumb"
                     th:src="@{/cart/thumb/{id}(id=${item.product.id})}"
                     th:alt="${item.product.title}"
                     onerror="this.style.display='none'">

                <div class="item-info">
                    <a class="item-title"
                       th:href="@{/products/{id}(id=${item.product.id})}"
                       th:text="${item.product.title}">상품명</a>
                    <span class="item-category"
                          th:text="${item.product.mainCategory.displayName + ' / ' + item.product.category.displayName}">카테고리</span>
                    <span class="item-stock" sec:authorize="hasRole('ADMIN')"
                          th:text="'남은 재고 ' + ${item.product.stockQuantity} + '개'">남은 재고 0개</span>
                </div>

                <div class="item-price">
                    <div th:text="${#numbers.formatInteger(item.product.effectivePrice, 0, 'COMMA')} + '원'">0원</div>
                    <div class="item-line-total"
                         th:text="'합계 ' + ${#numbers.formatInteger(item.product.effectivePrice * item.quantity, 0, 'COMMA')} + '원'">합계 0원</div>
                </div>

                <div class="item-controls">
                    <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post">
                        <input class="quantity-input" type="number" name="quantity" min="1"
                               th:value="${item.quantity}"
                               onchange="this.form.submit()">
                    </form>

                    <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                        <button type="submit" class="btn-remove">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <div>
                <span class="summary-label">총 합계</span>
                <span class="summary-total"
                      th:with="total=${#aggregates.sum(cartItems.![product.effectivePrice * quantity])}"
                      th:text="${#numbers.formatInteger(total, 0, 'COMMA')} + '원'">0원</span>
            </div>
            <form th:action="@{/order/buy}" method="post">
                <button type="submit" class="order-btn">주문서 작성</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
