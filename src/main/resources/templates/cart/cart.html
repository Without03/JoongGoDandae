<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단국스토어 - 장바구니</title>
    <style>
        :root {
            --dankook-blue: #0059a9;
            --border-gray: #e1e4e8;
            --bg-soft: #f8f9fc;
            --text-main: #2d3436;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-soft);
            margin: 0;
            color: var(--text-main);
        }

        nav {
            background: #fff;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
        }

        nav a {
            text-decoration: none;
            color: #666;
            margin-right: 25px;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dankook-blue);
            margin-bottom: 30px;
        }

        /* 장바구니 메인 카드 */
        .cart-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border-gray);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow: hidden;
        }

        .cart-header {
            padding: 20px 30px;
            background: #fcfcfc;
            border-bottom: 1px solid var(--border-gray);
            font-weight: 700;
        }

        .cart-body {
            padding: 40px 30px;
            text-align: center;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .empty-text {
            font-size: 1.1rem;
            color: #999;
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        .btn-blue {
            background: var(--dankook-blue);
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
            display: inline-block;
        }

        .btn-blue:hover {
            background: #004582;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/}">메인홈</a>
    <a th:href="@{/mypage}">마이페이지</a>
    <a th:href="@{/notifications}">알림</a>
</nav>

<div class="container">
    <h2 class="page-title">Shopping Cart</h2>

    <div class="cart-card">
        <div class="cart-header">
            장바구니에 담긴 상품
        </div>
        <div class="cart-body">
            <span class="empty-icon">🛒</span>
            <p class="empty-text">장바구니가 비어 있습니다.<br>단국대학교의 다양한 상품을 확인해보세요.</p>
            <a th:href="@{/}" class="btn-blue">쇼핑 계속하기</a>
        </div>
    </div>
</div>

</body>
</html>
