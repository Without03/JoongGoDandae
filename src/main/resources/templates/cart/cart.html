<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단국스토어 - 장바구니</title>
    <link rel="stylesheet" href="/css/darkmode.css">
    <script src="/js/darkmode.js"></script>
    <style>
        :root {
            --dankook-blue: #0059a9;
            --border-gray: #e1e4e8;
            --bg-soft: #f8f9fc;
            --text-main: #2d3436;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-soft);
            margin: 0;
            color: var(--text-main);
        }

        nav {
            background: #fff;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
        }

        nav a {
            text-decoration: none;
            color: #666;
            margin-right: 25px;
            font-weight: 600;
        }

        nav a:hover { color: var(--dankook-blue); }

        .container {
            max-width: 860px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dankook-blue);
            margin-bottom: 30px;
        }

        .cart-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border-gray);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cart-header {
            padding: 18px 28px;
            background: #fcfcfc;
            border-bottom: 1px solid var(--border-gray);
            font-weight: 700;
            font-size: 0.95rem;
            color: #555;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px 28px;
            border-bottom: 1px solid #f3f3f3;
            gap: 20px;
        }

        .cart-item:last-child { border-bottom: none; }

        .item-thumb {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            background: #f4f6fa;
            flex-shrink: 0;
            border: 1px solid #eee;
        }

        .item-info { flex-grow: 1; }

        .item-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--dankook-blue);
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .item-title:hover { text-decoration: underline; }

        .item-category {
            font-size: 0.78rem;
            color: #aaa;
        }

        .item-price {
            font-weight: 800;
            font-size: 1.05rem;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .btn-remove {
            background: none;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            color: #999;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-remove:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .cart-summary {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border-gray);
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label { font-size: 0.95rem; color: #666; font-weight: 600; }

        .summary-total {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--dankook-blue);
        }

        .cart-body {
            padding: 60px 30px;
            text-align: center;
        }

        .empty-icon { font-size: 3rem; display: block; margin-bottom: 16px; }

        .empty-text {
            font-size: 1rem;
            color: #999;
            margin-bottom: 28px;
        }

        .btn-blue {
            background: var(--dankook-blue);
            color: #fff;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: 0.2s;
        }

        .btn-blue:hover { background: #004582; transform: translateY(-2px); }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/}">메인홈</a>
    <a th:href="@{/mypage}">마이페이지</a>
    <a th:href="@{/notifications}">알림</a>
</nav>

<div class="container">
    <h2 class="page-title">🛒 장바구니</h2>

    <!-- 빈 장바구니 -->
    <div class="cart-card" th:if="${#lists.isEmpty(cartItems)}">
        <div class="cart-body">
            <span class="empty-icon">🛒</span>
            <p class="empty-text">장바구니가 비어 있습니다.<br>단국대학교의 다양한 상품을 확인해보세요.</p>
            <a th:href="@{/}" class="btn-blue">쇼핑 계속하기</a>
        </div>
    </div>

    <!-- 장바구니 상품 목록 -->
    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="cart-card">
            <div class="cart-header" th:text="${#lists.size(cartItems)} + '개의 상품'">0개의 상품</div>

            <div class="cart-item" th:each="item : ${cartItems}">
                <img class="item-thumb"
                     th:src="@{/cart/thumb/{id}(id=${item.product.id})}"
                     th:alt="${item.product.title}"
                     onerror="this.style.display='none'">

                <div class="item-info">
                    <a class="item-title"
                       th:href="@{/products/{id}(id=${item.product.id})}"
                       th:text="${item.product.title}">상품명</a>
                    <span class="item-category" th:text="${item.product.category.displayName}">카테고리</span>
                </div>

                <div class="item-price"
                     th:text="${#numbers.formatInteger(item.product.price, 0, 'COMMA')} + '원'">0원</div>

                <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                    <button type="submit" class="btn-remove">삭제</button>
                </form>
            </div>
        </div>

        <!-- 합계 -->
        <div class="cart-summary">
            <span class="summary-label">총 합계</span>
            <span class="summary-total"
                  th:with="total=${#aggregates.sum(cartItems.![product.price])}"
                  th:text="${#numbers.formatInteger(total, 0, 'COMMA')} + '원'">0원</span>
        </div>
    </div>
</div>
</body>
</html>
