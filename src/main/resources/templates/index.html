<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DANKOOK STORE</title>
    <link rel="stylesheet" href="/css/darkmode.css">
    <script src="/js/darkmode.js"></script>
    <style>
        :root {
            --bg: #f3f5f8;
            --panel: #ffffff;
            --line: #e5e8ee;
            --text: #1f2937;
            --muted: #6b7280;
            --main: #0a559c;
            --main-dark: #08457f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", sans-serif;
        }

        .top-header {
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        .top-inner {
            max-width: 1140px;
            margin: 0 auto;
            height: 74px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand {
            width: 280px;
            text-decoration: none;
            color: inherit;
            flex: 0 0 auto;
            border-radius: 10px;
            padding: 4px 6px;
            transition: background-color 0.18s ease;
        }

        .brand-title {
            margin: 0;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -0.6px;
            color: var(--main);
            line-height: 0.95;
            white-space: nowrap;
            transition: color 0.18s ease;
        }

        .brand-sub {
            margin: 3px 0 0;
            font-size: 11px;
            color: #6b7280;
            font-weight: 600;
            transition: color 0.18s ease;
        }

        .brand:hover {
            background: #f4f8fc;
        }

        .brand:hover .brand-title,
        .brand:hover .brand-sub {
            color: var(--main-dark);
        }

        .search-wrap {
            flex: 1;
            min-width: 220px;
        }

        .search-form {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 0 45px 0 16px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .search-input:hover {
            border-color: #b9c5d8;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
        }

        .search-input:focus {
            border-color: #7aa3cf;
            box-shadow: 0 0 0 3px rgba(10, 85, 156, 0.12);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: #8a93a3;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .search-btn:hover {
            background: #edf4fb;
            color: var(--main);
        }

        .quick-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .quick-link {
            width: 58px;
            min-height: 50px;
            border-radius: 8px;
            padding-top: 4px;
            text-align: center;
            color: #374151;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .quick-link svg {
            width: 19px;
            height: 19px;
            display: block;
            margin: 0 auto 4px;
            color: #4b5563;
            transition: color 0.18s ease;
        }

        .quick-link:hover {
            background: #edf4fb;
            color: var(--main);
        }

        .quick-link:hover svg {
            color: var(--main);
        }

        .quick-logout {
            border: 1px solid #d7deea;
            background: #fff;
            height: 38px;
            border-radius: 8px;
            padding: 0 11px;
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
            cursor: pointer;
            transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease;
        }

        .quick-logout:hover {
            border-color: #b7cde6;
            color: var(--main);
            background: #edf4fb;
        }

        .product-new {
            text-decoration: none;
            background: var(--main);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            height: 38px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .product-new:hover {
            background: var(--main-dark);
            box-shadow: 0 6px 14px rgba(10, 85, 156, 0.2);
            transform: translateY(-1px);
        }

        .category-bar {
            border-bottom: 1px solid var(--line);
            background: #fff;
            position: relative;
            z-index: 20;
        }

        .category-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 16px;
            overflow: visible;
            white-space: nowrap;
        }

        .category-item {
            position: relative;
            display: inline-flex;
            align-items: stretch;
        }

        .category-tab {
            height: 52px;
            border: 0;
            background: transparent;
            color: #4b5563;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            border-bottom: 3px solid transparent;
            padding: 0 2px;
            cursor: pointer;
            transition: color 0.18s ease, border-color 0.18s ease;
        }

        .category-tab:hover {
            color: var(--main);
            border-bottom-color: #b7cde6;
        }

        .category-tab.active {
            color: var(--main);
            border-bottom-color: var(--main);
        }

        .category-tab.active:hover {
            color: var(--main);
            border-bottom-color: var(--main);
        }

        .subcategory-menu {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 170px;
            background: #fff;
            border: 1px solid #d6dee8;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
            z-index: 30;
        }

        .category-item:hover .subcategory-menu,
        .category-item:focus-within .subcategory-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .subcategory-link {
            display: block;
            padding: 8px 12px;
            color: #4b5563;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .subcategory-link:hover {
            color: var(--main);
            background: #f2f7fd;
        }

        .subcategory-link.active {
            color: var(--main);
            background: #e8f1fb;
        }

        .page-wrap {
            max-width: 1140px;
            margin: 0 auto;
            padding: 18px 20px 42px;
        }

        .list-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-count {
            color: #4b5563;
            font-size: 14px;
            font-weight: 700;
        }

        .sort-select {
            border: 1px solid var(--line);
            border-radius: 8px;
            height: 34px;
            padding: 0 32px 0 10px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            background: #fff;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
            cursor: pointer;
        }

        .sort-select:hover {
            border-color: #b9c5d8;
            background: #f9fbff;
        }

        .sort-select:focus {
            outline: none;
            border-color: #7aa3cf;
            box-shadow: 0 0 0 3px rgba(10, 85, 156, 0.14);
        }

        .sort-wrap {
            position: relative;
            display: inline-block;
        }

        .sort-arrow {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            width: 14px;
            height: 14px;
            pointer-events: none;
            transition: color 0.18s ease;
        }

        .sort-wrap:hover .sort-arrow,
        .sort-select:focus+.sort-arrow {
            color: var(--main);
        }

        .sort-select option {
            background: #fff;
            color: #1f2937;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #e3e7ee;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.07);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 294px;
            position: relative;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            cursor: pointer;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            min-height: 294px;
        }

        .thumb-wrap {
            background: #f4f6fa;
            height: 190px;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            transition: transform 0.2s ease;
        }

        .thumb-empty {
            color: #9aa3b2;
            font-size: 14px;
            font-weight: 700;
        }

        .sold-out-overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(17, 24, 39, 0.46);
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        .card-body {
            padding: 11px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .item-title {
            margin: 0;
            font-size: 19px;
            line-height: 1.28;
            font-weight: 800;
            min-height: 42px;
            transition: color 0.18s ease;
        }

        .item-price {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        .item-meta {
            margin-top: auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
            font-weight: 700;
        }

        .card-action-btn {
            width: 29px;
            height: 29px;
            position: absolute;
            right: 10px;
            bottom: 10px;
            z-index: 2;
            border-radius: 8px;
            border: 1px solid #dfe4ec;
            background: #f9fafb;
            display: grid;
            place-items: center;
            color: #6b7280;
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
            cursor: pointer;
            padding: 0;
        }

        .card-actions {
            position: absolute;
            right: 10px;
            bottom: 10px;
            z-index: 2;
            display: flex;
            gap: 6px;
        }

        .card-actions .card-action-btn {
            position: static;
            right: auto;
            bottom: auto;
        }

        .card-action-btn:hover {
            background: #eaf3fd;
            border-color: #b7cde6;
            color: var(--main);
        }

        .card-action-btn:active {
            transform: translateY(1px);
        }

        .card-action-btn.is-added {
            background: var(--main);
            border-color: var(--main);
            color: #fff;
        }

        .wishlist-action-btn.is-added {
            background: #fff1f2;
            border-color: #fecdd3;
            color: #e11d48;
        }

        .wishlist-action-btn:hover {
            background: #fff1f2;
            border-color: #fda4af;
            color: #e11d48;
        }

        .card-action-btn:focus-visible {
            outline: 0;
            box-shadow: 0 0 0 3px rgba(10, 85, 156, 0.2);
        }

        .card:hover {
            border-color: #d4dceb;
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
        }

        .card:hover .item-title {
            color: var(--main);
        }

        .card:hover .thumb-wrap img {
            transform: scale(1.02);
        }

        .card.is-out-of-stock {
            background: #f1f3f5;
            border-color: #d1d5db;
            color: #6b7280;
        }

        .card.is-out-of-stock .thumb-wrap img {
            filter: grayscale(1);
            opacity: 0.62;
        }

        .card.is-out-of-stock .item-title,
        .card.is-out-of-stock .item-price,
        .card.is-out-of-stock .item-meta {
            color: #6b7280;
        }

        .card.is-out-of-stock:hover .item-title {
            color: #4b5563;
        }

        .card:active {
            transform: translateY(-1px);
        }

        .empty-box {
            border: 1px dashed #c8d0dd;
            border-radius: 10px;
            background: #fff;
            color: #64748b;
            font-size: 15px;
            font-weight: 700;
            padding: 30px;
            text-align: center;
        }

        .bottom-tools {
            display: none;
        }

        @media (max-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .top-inner {
                gap: 12px;
            }

            .quick-link {
                display: none;
            }
        }

        @media (max-width: 760px) {
            .top-inner {
                height: auto;
                padding: 12px 14px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .brand {
                width: auto;
                min-width: 160px;
            }

            .brand-title {
                font-size: 22px;
            }

            .search-wrap {
                order: 3;
                width: 100%;
            }

            .product-new {
                height: 34px;
                font-size: 13px;
            }

            .category-inner,
            .page-wrap {
                padding-left: 14px;
                padding-right: 14px;
            }

            .category-tab {
                height: 46px;
                font-size: 14px;
            }

            .category-inner {
                overflow-x: auto;
                overflow-y: hidden;
            }

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .thumb-wrap {
                height: 150px;
            }

            .item-title {
                font-size: 15px;
                min-height: 38px;
            }

            .item-price {
                font-size: 23px;
            }

            .item-meta {
                font-size: 12px;
            }
        }

        /* ── 사이드 할인 배너 ───────────────────── */
        .sale-banner-wrap {
            pointer-events: none;
            /* wrap 자체는 클릭 안 막음 */
        }

        .sale-banner-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
        }

        .sale-banner {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            background: #fff;
            border: 1.5px solid #f0c0bc;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(192, 57, 43, 0.13);
            padding: 14px 12px;
            pointer-events: auto;
        }

        /* 콘텐츠 영역(1140px) 바깥 여백 중앙에 배치 */
        .sale-banner-left {
            left: calc(50% - 570px - 180px);
        }

        .sale-banner-right {
            right: calc(50% - 570px - 180px);
        }

        @media (max-width: 1560px) {
            .sale-banner-left {
                left: calc(50% - 570px - 170px);
            }

            .sale-banner-right {
                right: calc(50% - 570px - 170px);
            }
        }

        @media (max-width: 1400px) {
            .sale-banner {
                display: none;
            }
        }

        /* 상품 썸네일 이미지 */
        .sale-banner-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 9px;
            margin-bottom: 7px;
            background: #f3f5f8;
            display: block;
        }

        .sale-banner-img-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 9px;
            background: #f3f5f8;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #aaa;
        }

        .sale-banner-label {
            font-size: 0.78rem;
            font-weight: 900;
            color: #c0392b;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
            text-align: center;
        }

        /* 왼쪽: 상품 목록 */
        .sale-banner-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sale-banner-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 7px 8px;
            border-radius: 9px;
            transition: background 0.15s;
        }

        .sale-banner-link:hover {
            background: #fdf2f2;
        }

        .sale-banner-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 118px;
            display: block;
        }

        .sale-banner-price {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sale-origin {
            font-size: 0.68rem;
            color: #aaa;
            text-decoration: line-through;
        }

        .sale-discounted {
            font-size: 0.8rem;
            font-weight: 800;
            color: #c0392b;
        }

        /* 오른쪽: 요약 CTA */
        .sale-banner-count {
            font-size: 1.15rem;
            font-weight: 900;
            color: #1f2937;
            text-align: center;
            margin: 10px 0 12px;
            line-height: 1.35;
        }

        .sale-banner-count span {
            font-size: 1.6rem;
            color: #c0392b;
            display: block;
        }

        .sale-banner-btn {
            display: block;
            text-align: center;
            background: #c0392b;
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 8px 6px;
            border-radius: 9px;
            transition: background 0.15s;
        }

        .sale-banner-btn:hover {
            background: #a93226;
        }
    </style>
</head>

<body>
    <header class="top-header">
        <div class="top-inner">
            <a class="brand" th:href="@{/}">
                <p class="brand-title">DANKOOK STORE</p>
                <p class="brand-sub">단국대학교 공식 스토어</p>
            </a>

            <div class="search-wrap">
                <form class="search-form" method="get" th:action="@{/}">
                    <input class="search-input" type="text" name="keyword" th:value="${keyword}"
                        placeholder="상품명을 검색해보세요">
                    <button class="search-btn" type="submit" aria-label="검색">
                        <svg viewBox="0 0 24 24" fill="none" width="20" height="20" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
                            <path d="M20 20L16.6 16.6" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            </path>
                        </svg>
                    </button>
                </form>
            </div>

            <nav class="quick-links" aria-label="鍮좊Ⅸ 硫붾돱">
                <a class="quick-link" th:href="@{/mypage}" sec:authorize="isAuthenticated()">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
                        <path d="M4 20C5 16.6 7.8 15 12 15C16.2 15 19 16.6 20 20" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    마이페이지
                </a>
                <a class="quick-link" th:href="@{/cart}" sec:authorize="isAuthenticated()">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 5H6L8.5 15H18.5L21 8H7" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="10" cy="19" r="1.4" fill="currentColor" />
                        <circle cx="17" cy="19" r="1.4" fill="currentColor" />
                    </svg>
                    장바구니
                </a>
                <a class="quick-link" th:href="@{/notifications}" sec:authorize="isAuthenticated()">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path
                            d="M12 3C8.9 3 6.4 5.5 6.4 8.6V11.7C6.4 12.5 6.1 13.2 5.6 13.8L4.5 15.1C3.9 15.9 4.4 17 5.4 17H18.6C19.6 17 20.1 15.9 19.5 15.1L18.4 13.8C17.9 13.2 17.6 12.5 17.6 11.7V8.6C17.6 5.5 15.1 3 12 3Z"
                            stroke="currentColor" stroke-width="2" />
                        <path d="M10 20C10.5 20.6 11.2 21 12 21C12.8 21 13.5 20.6 14 20" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" />
                    </svg>
                    알림<span th:if="${unreadCount > 0}" th:text="'(' + ${unreadCount} + ')'">(0)</span>
                </a>
                <a class="product-new" th:href="@{/products/new}" sec:authorize="hasRole('ADMIN')">판매</a>
                <a class="quick-link" th:href="@{/auth/login}" sec:authorize="!isAuthenticated()">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 12C14.2 12 16 10.2 16 8C16 5.8 14.2 4 12 4C9.8 4 8 5.8 8 8C8 10.2 9.8 12 12 12Z"
                            stroke="currentColor" stroke-width="2" />
                        <path d="M4 20C5 16.6 7.8 15 12 15C16.2 15 19 16.6 20 20" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    로그인
                </a>
                <form th:action="@{/auth/logout}" method="post" style="margin:0" sec:authorize="isAuthenticated()">
                    <button type="submit" class="quick-logout">로그아웃</button>
                </form>
            </nav>
        </div>
    </header>

    <nav class="category-bar">
        <div class="category-inner">
            <a class="category-tab" th:classappend="${selectedMainCategory == null} ? ' active'" th:href="@{/}">전체상품</a>
            <div class="category-item" th:each="main : ${mainCategories}">
                <a class="category-tab" th:classappend="${main == selectedMainCategory} ? ' active'"
                    th:href="@{/(mainCategory=${main},keyword=${keyword},sort=${selectedSort})}"
                    th:text="${main.displayName}">대분류</a>
                <div class="subcategory-menu">
                    <a class="subcategory-link" th:each="sub : ${categories}" th:if="${sub.mainCategory == main}"
                        th:classappend="${sub == selectedCategory} ? ' active'"
                        th:href="@{/(mainCategory=${main},category=${sub},keyword=${keyword},sort=${selectedSort})}"
                        th:text="${sub.displayName}">소분류</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-wrap">
        <!-- 할인 상품 사이드 배너 -->
        <div class="sale-banner-wrap" th:if="${!#lists.isEmpty(discountedProducts)}">
            <!-- 왼쪽 배너 -->
            <div class="sale-banner sale-banner-left">
                <div class="sale-banner-label">🔥 할인중</div>
                <ul class="sale-banner-list">
                    <li th:each="p : ${discountedProducts}" class="sale-banner-item">
                        <a th:href="@{/products/{id}(id=${p.id})}" class="sale-banner-link">
                            <!-- 썸네일 이미지 -->
                            <img th:if="${thumbnails[p.id] != null}" th:src="${'/uploads/' + thumbnails[p.id]}"
                                class="sale-banner-img" alt="상품 이미지">
                            <div th:if="${thumbnails[p.id] == null}" class="sale-banner-img-placeholder">NO IMAGE</div>

                            <span class="sale-banner-title" th:text="${p.title}">상품명</span>
                            <span class="sale-banner-price">
                                <span class="sale-origin"
                                    th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"></span>
                                <span class="sale-discounted"
                                    th:text="${#numbers.formatInteger(p.discountPrice, 0, 'COMMA')} + '원'"></span>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
            <!-- 오른쪽 배너 -->
            <div class="sale-banner sale-banner-right">
                <div class="sale-banner-label">💸 지금 세일중!</div>
                <div class="sale-banner-count">
                    <span th:text="${#lists.size(discountedProducts)}">0</span>개 상품 할인중
                </div>
                <div class="sale-banner-cta">
                    <a th:href="@{/(status=DISCOUNTED)}" class="sale-banner-btn">할인 상품 보기 →</a>
                </div>
            </div>
        </div>
        <div class="list-head">
            <div class="list-count" th:text="'전체 ' + ${#lists.size(products)} + '개'">전체 0개</div>
            <form method="get" th:action="@{/}">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <input type="hidden" name="category" th:value="${selectedCategory}">
                <input type="hidden" name="mainCategory" th:value="${selectedMainCategory}">
                <div class="sort-wrap">
                    <select class="sort-select" name="sort">
                        <option value="recommended" th:selected="${selectedSort == 'recommended'}">추천순</option>
                        <option value="popular" th:selected="${selectedSort == 'popular'}">인기순</option>
                        <option value="recent" th:selected="${selectedSort == 'recent'}">최신순</option>
                        <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">낮은 가격순</option>
                        <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">높은 가격순</option>
                    </select>
                    <svg class="sort-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
            </form>
        </div>

        <div class="empty-box" th:if="${#lists.isEmpty(products)}">
            등록된 상품이 없습니다.
        </div>

        <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
            <article class="card" th:each="product : ${products}"
                th:classappend="${product.status.name() == 'OUT_OF_STOCK'} ? ' is-out-of-stock'">
                <a class="card-link" th:href="@{/products/{id}(id=${product.id})}">
                    <div class="thumb-wrap">
                        <img th:if="${thumbnails[product.id] != null}" th:src="${'/uploads/' + thumbnails[product.id]}"
                            alt="상품 이미지">
                        <div th:if="${thumbnails[product.id] == null}" class="thumb-empty">NO IMAGE</div>
                        <div class="sold-out-overlay" th:if="${product.status.name() == 'OUT_OF_STOCK'}">품절</div>
                    </div>
                    <div class="card-body">
                        <p class="item-title" th:text="${product.title}">상품명</p>
                        <p class="item-price">
                            <span th:if="${product.status.name() == 'DISCOUNTED' and product.discountPrice != null}">
                                <span
                                    style="text-decoration: line-through; color: #999; font-size: 0.85em; margin-right: 6px;"
                                    th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'"></span>
                                <span style="color: #c0392b; font-weight: 800;"
                                    th:text="${#numbers.formatInteger(product.discountPrice, 0, 'COMMA')} + '원'"></span>
                            </span>
                            <span th:unless="${product.status.name() == 'DISCOUNTED' and product.discountPrice != null}"
                                th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'"></span>
                        </p>
                        <div class="item-meta">
                            <span
                                th:text="${product.mainCategory.displayName + ' / ' + product.category.displayName}">카테고리</span>
                            <span style="margin-left:8px;"
                                th:text="${product.stockQuantity > 0 ? '재고 ' + product.stockQuantity + '개' : '재고 없음'}">재고 0개</span>
                        </div>
                    </div>
                </a>
                <div class="card-actions" sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                    <button type="button" class="card-action-btn wishlist-action-btn" aria-label="관심목록 버튼"
                        th:data-product-id="${product.id}">
                        <svg viewBox="0 0 24 24" fill="none" width="15" height="15">
                            <path
                                d="M12 20.5C12 20.5 4.5 16.2 4.5 9.8C4.5 7.2 6.4 5.5 8.7 5.5C10.1 5.5 11.3 6.2 12 7.3C12.7 6.2 13.9 5.5 15.3 5.5C17.6 5.5 19.5 7.2 19.5 9.8C19.5 16.2 12 20.5 12 20.5Z"
                                stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button type="button" class="card-action-btn cart-action-btn" aria-label="장바구니 버튼"
                        th:data-product-id="${product.id}">
                        <svg viewBox="0 0 24 24" fill="none" width="15" height="15">
                            <path d="M3 5H6L8.5 15H18.5L21 8H7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="10" cy="19" r="1.5" fill="currentColor" />
                            <circle cx="17" cy="19" r="1.5" fill="currentColor" />
                        </svg>
                    </button>
                </div>
            </article>
        </div>
    </main>

    <script>
        (function () {
            var csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
            var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
            var csrfToken = csrfTokenMeta ? csrfTokenMeta.content : "";
            var csrfHeaderName = csrfHeaderMeta ? csrfHeaderMeta.content : "";

            function buildPostOptions() {
                var headers = {};
                if (csrfToken && csrfHeaderName) {
                    headers[csrfHeaderName] = csrfToken;
                }
                return {
                    method: "POST",
                    headers: headers
                };
            }

            function handleProtectedResponse(res) {
                if (res.redirected && res.url.indexOf("/auth/login") !== -1) {
                    window.location.href = "/auth/login";
                    return null;
                }
                if (res.status === 401) {
                    window.location.href = "/auth/login";
                    return null;
                }
                if (res.status === 403) {
                    alert("보안 토큰이 만료되었습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.");
                    return null;
                }
                return res;
            }

            // 장바구니 버튼 초기 상태 + 클릭 이벤트
            document.querySelectorAll(".cart-action-btn[data-product-id]").forEach(function (button) {
                var productId = button.dataset.productId;

                // 페이지 로드 시 서버에서 담김 여부 조회
                fetch("/cart/status/" + productId)
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        if (data && data.inCart) button.classList.add("is-added");
                    });

                // 클릭 시 토글 요청
                button.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();

                    fetch("/cart/toggle/" + productId, buildPostOptions())
                        .then(function (res) {
                            res = handleProtectedResponse(res);
                            if (!res) return null;
                            return res.json();
                        })
                        .then(function (data) {
                            if (!data) return;
                            button.classList.toggle("is-added", data.inCart);
                        });
                });
            });

            document.querySelectorAll(".wishlist-action-btn[data-product-id]").forEach(function (button) {
                var productId = button.dataset.productId;

                fetch("/wishlist/status/" + productId)
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        if (data && data.wishlisted) button.classList.add("is-added");
                    });

                button.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();

                    fetch("/wishlist/toggle/" + productId, buildPostOptions())
                        .then(function (res) {
                            res = handleProtectedResponse(res);
                            if (!res) return null;
                            return res.json();
                        })
                        .then(function (data) {
                            if (!data) return;
                            button.classList.toggle("is-added", data.wishlisted);
                        });
                });
            });

            // 정렬 셀렉트 자동 제출
            document.querySelectorAll(".sort-select").forEach(function (select) {
                select.addEventListener("change", function () { select.form.submit(); });
            });
        }());
    </script>
</body>

</html>
