<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단북 메인</title>
</head>
<body>
<!-- 홈 메인 페이지 (로그인 필요) -->
<h1>단국대 중고거래 단북</h1>

<!-- 네비게이션 바 (로그인 사용자용) -->
<nav>
    <a th:href="@{/}">홈</a> |
    <a th:href="@{/mypage}">마이페이지</a> |
    <!-- 읽지 않은 알림 수를 배지로 표시 -->
    <a th:href="@{/notifications}">
        알림<span th:if="${unreadCount > 0}" th:text="'(' + ${unreadCount} + ')'" style="color:red; font-weight:bold"></span>
    </a> |
    <a th:href="@{/products/new}">상품 등록</a> |
    <!-- 로그아웃 폼 -->
    <form th:action="@{/auth/logout}" method="post" style="display:inline">
        <button type="submit" style="background:none;border:none;cursor:pointer;padding:0;color:inherit;text-decoration:underline">로그아웃</button>
    </form>
</nav>

<hr>

<!-- 검색/필터 폼 -->
<form method="get" th:action="@{/}">
    <!-- 키워드 검색 -->
    <input type="text" name="keyword" th:value="${keyword}" placeholder="키워드 검색">
    <!-- 카테고리 필터 -->
    <select name="category">
        <option value="">전체 카테고리</option>
        <option th:each="cat : ${categories}"
                th:value="${cat}"
                th:text="${cat.displayName}"
                th:selected="${cat == selectedCategory}">카테고리</option>
    </select>
    <button type="submit">검색</button>
    <a th:href="@{/}">초기화</a>
</form>

<hr>

<!-- 상품 목록 (빈 경우 안내 메시지) -->
<div th:if="${#lists.isEmpty(products)}">
    <p>등록된 상품이 없습니다.</p>
</div>

<!-- 상품 목록 렌더링 -->
<div th:each="product : ${products}" style="display:flex; align-items:center; gap:12px; margin-bottom:12px; padding:8px; border-bottom:1px solid #eee">
    <!-- 상품 썸네일 이미지 -->
    <a th:href="@{/products/{id}(id=${product.id})}">
        <img th:if="${thumbnails[product.id] != null}"
             th:src="${'/uploads/' + thumbnails[product.id]}"
             alt="상품 이미지"
             style="width:80px; height:80px; object-fit:cover; border:1px solid #ddd; border-radius:4px">
        <!-- 이미지가 없으면 회색 박스 표시 -->
        <div th:if="${thumbnails[product.id] == null}"
             style="width:80px; height:80px; background:#f0f0f0; border:1px solid #ddd; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:0.8em">
            없음
        </div>
    </a>
    <!-- 상품 정보 -->
    <div>
        <div>
            <!-- 상품 제목 및 상태 -->
            <a th:href="@{/products/{id}(id=${product.id})}">
                <strong th:text="${product.title}">제목</strong>
            </a>
            &nbsp;
            <span th:text="${product.status.displayName}">상태</span>
        </div>
        <div>
            <!-- 가격 및 카테고리 -->
            <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">가격</span>
            &nbsp;
            <span th:text="'[' + ${product.category.displayName} + ']'">[카테고리]</span>
        </div>
    </div>
</div>
</body>
</html>
