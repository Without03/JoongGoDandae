<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단국스토어 - 알림</title>
    <style>
        :root {
            --dankook-blue: #0059a9;
            --border-gray: #e1e4e8;
            --bg-soft: #f8f9fc;
            --text-main: #2d3436;
            --unread-bg: #f0f7ff; /* 읽지 않은 알림 배경색 */
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-soft);
            margin: 0;
            color: var(--text-main);
        }

        /* 상단 네비바 */
        nav {
            background: #fff;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
        }

        nav a {
            text-decoration: none;
            color: #666;
            margin-right: 25px;
            font-weight: 600;
        }

        nav a:hover { color: var(--dankook-blue); }

        .btn-logout {
            background: none;
            border: 1px solid var(--border-gray);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: #888;
            font-size: 0.85rem;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dankook-blue);
            margin: 0;
        }

        /* 알림 카드 스타일 */
        .noti-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .noti-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 25px;
            border: 1px solid var(--border-gray);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .noti-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* 읽지 않은 알림 스타일 */
        .noti-card.unread {
            background-color: var(--unread-bg);
            border-color: var(--dankook-blue);
        }

        .noti-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .message-box {
            flex-grow: 1;
        }

        .new-badge {
            background: var(--dankook-blue);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: 700;
            margin-bottom: 8px;
            display: inline-block;
        }

        .message {
            font-size: 1rem;
            line-height: 1.5;
            color: #333;
            white-space: pre-line;
            margin: 0;
        }

        .noti-meta {
            text-align: right;
            min-width: 130px;
            flex-shrink: 0;
        }

        .btn-view {
            color: var(--dankook-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
        }

        .date {
            font-size: 0.8rem;
            color: #aaa;
            display: block;
        }

        .empty-box {
            text-align: center;
            padding: 80px 0;
            background: #fff;
            border-radius: 16px;
            border: 1px dashed var(--border-gray);
            color: #bbb;
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/}">홈</a>
    <a th:href="@{/mypage}">마이페이지</a>
    <a th:href="@{/cart}">장바구니</a>
    <form th:action="@{/auth/logout}" method="post" style="margin-left: auto;">
        <button type="submit" class="btn-logout">로그아웃</button>
    </form>
</nav>

<div class="container">
    <div class="page-header">
        <h2 class="page-title">Notifications</h2>
    </div>

    <div class="empty-box" th:if="${#lists.isEmpty(notifications)}">
        <p>새로운 알림이 없습니다.</p>
    </div>

    <div class="noti-list" th:if="${!#lists.isEmpty(notifications)}">
        <div th:each="noti : ${notifications}" 
             class="noti-card" 
             th:classappend="${!noti.read} ? 'unread' : ''">
            
            <div class="noti-content">
                <div class="message-box">
                    <span th:if="${!noti.read}" class="new-badge">NEW</span>
                    <p class="message" th:text="${noti.message}">알림 메시지가 여기에 표시됩니다.</p>
                </div>
                
                <div class="noti-meta">
                    <a th:href="@{/products/{id}(id=${noti.product.id})}" class="btn-view">상품 상세보기 →</a>
                    <span class="date" th:text="${#temporals.format(noti.createdAt, 'yyyy-MM-dd HH:mm')}">2024-04-23 00:00</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
